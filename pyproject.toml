[project]
name = "knowledgeops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic-settings", "email-validator",
  "sqlalchemy[asyncio]", "asyncpg", "alembic", "pgvector",
  "argon2-cffi", "pyjwt", "structlog", "redis", "arq", "boto3",
  "python-multipart", "python-magic", "beautifulsoup4", "pymupdf",
  "sentence-transformers", "anthropic", "prometheus-client", "pyyaml", "numpy",
]

[dependency-groups]
dev = [
  "pytest", "pytest-asyncio", "httpx", "testcontainers[postgres]",
  "psycopg2-binary", "ruff", "mypy", "types-pyyaml", "boto3-stubs",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]          # allow assert in tests

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true